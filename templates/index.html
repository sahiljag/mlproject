<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML Prediction Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #141e30, transparent 40%),
                #080c14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge {
            display: inline-block;
            padding: 7px 15px;
            border-radius: 30px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header h1 span {
            color: #818cf8;
        }

        .header p {
            color: #a8b0c0;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.25s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.12);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        select option {
            background: #111827;
            color: white;
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .predict-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
        }

        .predict-btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .result-title {
            color: #86efac;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #4ade80;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 700px) {

            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="badge">
                🤖 Machine Learning Model
            </div>

            <h1>
                ML <span>Prediction</span>
            </h1>

            <p>
                Enter the required information to generate a prediction
                using our trained machine learning model.
            </p>

        </div>


        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="form-grid">

                <div class="input-group">
                    <label>Feature 1</label>
                    <input
                        type="number"
                        name="feature1"
                        placeholder="Enter value"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Feature 2</label>
                    <input
                        type="number"
                        name="feature2"
                        placeholder="Enter value"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Feature 3</label>
                    <input
                        type="number"
                        name="feature3"
                        placeholder="Enter value"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Feature 4</label>
                    <input
                        type="number"
                        name="feature4"
                        placeholder="Enter value"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Feature 5</label>
                    <input
                        type="number"
                        name="feature5"
                        placeholder="Enter value"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select name="category" required>
                        <option value="">Select category</option>
                        <option value="A">Category A</option>
                        <option value="B">Category B</option>
                        <option value="C">Category C</option>
                    </select>
                </div>

            </div>


            <div class="button-container">

                <button type="submit" class="predict-btn">
                    🚀 Generate Prediction
                </button>

            </div>

        </form>


        {% if results %}

        <div class="result">

            <div class="result-title">
                PREDICTION RESULT
            </div>

            <div class="result-value">
                {{ results }}
            </div>

        </div>

        {% endif %}


        <div class="footer">
            Powered by Machine Learning • Built with Python & Flask
        </div>

    </div>

</body>
</html>
